<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; color: #202124; }
    h1 { font-size: 20px; }
    label { display: block; margin-top: 16px; font-weight: bold; }
    input { margin-top: 6px; font-size: 15px; }
    button { margin-top: 20px; padding: 10px 20px; font-size: 15px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #mesej { margin-top: 20px; padding: 12px; border-radius: 6px; display: none; white-space: pre-wrap; }
    .ok { background: #e6f4ea; border: 1px solid #34a853; }
    .ralat { background: #fce8e6; border: 1px solid #d93025; }
    .amaran { background: #fef7e0; border: 1px solid #f9ab00; }
    table { border-collapse: collapse; margin-top: 12px; width: 100%; font-size: 13px; }
    th, td { border: 1px solid #ccc; padding: 4px 6px; text-align: left; vertical-align: top; }
  </style>
</head>
<body>
  <h1>Upload Kehadiran Harian</h1>

  <label for="tarikh">Tarikh kehadiran</label>
  <input type="date" id="tarikh" required>

  <label for="fail">Fail CSV dari IDME</label>
  <input type="file" id="fail" accept=".csv,text/csv">

  <button id="hantar">Hantar</button>

  <div id="mesej"></div>

  <script>
    const elTarikh = document.getElementById('tarikh');
    const elFail = document.getElementById('fail');
    const elHantar = document.getElementById('hantar');
    const elMesej = document.getElementById('mesej');

    // Default: tarikh hari ini (waktu peranti).
    const kini = new Date();
    const pad = n => String(n).padStart(2, '0');
    const hariIni = kini.getFullYear() + '-' + pad(kini.getMonth() + 1) + '-' + pad(kini.getDate());
    elTarikh.value = hariIni;
    elTarikh.max = hariIni;

    function jadual(tajuk, senarai) {
      const t = document.createElement('table');
      const h = t.insertRow();
      tajuk.forEach(x => { const th = document.createElement('th'); th.textContent = x; h.appendChild(th); });
      senarai.forEach(baris => {
        const r = t.insertRow();
        baris.forEach(x => { r.insertCell().textContent = String(x); });
      });
      return t;
    }

    function papar(ok, teks, gagal, kelas) {
      elMesej.className = kelas || (ok ? 'ok' : 'ralat');
      elMesej.style.display = 'block';
      elMesej.textContent = teks;
      if (gagal && gagal.length) {
        elMesej.appendChild(jadual(['Baris', 'Kandungan', 'Sebab'],
          gagal.map(g => [g.baris, g.kandungan, g.sebab])));
      }
    }

    // Hantar ke pelayan. sahkan=true hanya selepas pengguna setuju dengan pembetulan.
    function hantar(tarikh, teksCsv, sahkan) {
      elHantar.disabled = true;
      papar(true, 'Memproses...');
      google.script.run
        .withSuccessHandler(h => {
          elHantar.disabled = false;
          if (h.perluSahkan) return paparPembetulan(h, tarikh, teksCsv);
          papar(h.ok, h.mesej, h.gagal);
          if (h.ok) elFail.value = '';
        })
        .withFailureHandler(e => {
          elHantar.disabled = false;
          papar(false, 'Ralat pelayan: ' + (e && e.message ? e.message : e));
        })
        .prosesUpload(tarikh, teksCsv, sahkan);
    }

    function paparPembetulan(h, tarikh, teksCsv) {
      papar(false, h.mesej, null, 'amaran');
      elMesej.appendChild(jadual(['Baris', 'Tingkatan', 'Kelas', 'Dalam fail', 'Dibaca sebagai (hadir/jumlah)'],
        h.pembetulan.map(p => [p.baris, p.tingkatan, p.kelas, p.asal, p.baru])));

      const bSah = document.createElement('button');
      bSah.textContent = 'Sahkan & Simpan';
      const bBatal = document.createElement('button');
      bBatal.textContent = 'Batal';
      bBatal.style.marginLeft = '8px';
      bSah.onclick = () => hantar(tarikh, teksCsv, true);
      bBatal.onclick = () => papar(false, 'Dibatalkan. Tiada data disimpan.');
      elMesej.appendChild(bSah);
      elMesej.appendChild(bBatal);
      elHantar.disabled = true;
      bBatal.addEventListener('click', () => { elHantar.disabled = false; });
    }

    elHantar.addEventListener('click', () => {
      const tarikh = elTarikh.value;
      const fail = elFail.files[0];
      if (!tarikh) return papar(false, 'Sila pilih tarikh.');
      if (!fail) return papar(false, 'Sila pilih fail CSV.');
      if (fail.size > 1024 * 1024) return papar(false, 'Fail terlalu besar (had 1 MB).');

      const [y, m, d] = tarikh.split('-');
      if (!confirm('Simpan data kehadiran untuk ' + d + '/' + m + '/' + y + '?\nFail: ' + fail.name)) return;

      const pembaca = new FileReader();
      pembaca.onload = () => hantar(tarikh, pembaca.result, false);
      pembaca.onerror = () => { elHantar.disabled = false; papar(false, 'Fail tidak dapat dibaca.'); };
      pembaca.readAsText(fail, 'UTF-8');
    });
  </script>
</body>
</html>
